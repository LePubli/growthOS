server {
    listen 3000;
    listen [::]:3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's internal DNS resolver — resolves service names per-request,
    # not at startup. This prevents nginx from crashing when api-server
    # is temporarily unavailable or still starting.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        image/svg+xml font/woff font/woff2;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # API reverse proxy — forward /api/* to the api-server container.
    # Variable on host:port only (no path) so nginx passes the original URI unchanged.
    # DNS resolved per-request via Docker's internal resolver (avoids crash at startup).
    location /api/ {
        set $api_upstream api-server:3001;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 60s;
        # Pass all HTTP methods (GET, POST, PUT, PATCH, DELETE, OPTIONS)
        proxy_method $request_method;
    }

    # Static assets — long cache (hashed filenames from Vite)
    location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html — no cache (always fresh for SPA routing)
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback — all routes return index.html.
    # error_page 405 ensures POST requests (e.g. if proxy is unreachable)
    # don't return 405 from the static module — they get index.html instead.
    location / {
        error_page 405 =200 /index.html;
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hide nginx version
    server_tokens off;
}
