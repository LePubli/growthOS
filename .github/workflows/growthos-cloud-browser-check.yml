name: GrowthOS cloud browser check
on:
  pull_request:
    branches: [fix/growthos-functional-redesign, growthos-preprod]
    paths:
      - workers/cloud-browser/**
      - Dockerfile.browser
      - extensions/growthos-pagesjaunes/background.js
      - extensions/growthos-pagesjaunes/capture.js
      - extensions/growthos-pagesjaunes/societe.js
      - .github/workflows/growthos-cloud-browser-check.yml
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          version: 10.26.1
          run_install: false
      - name: Prepare real React review fixture
        run: |
          pnpm install --frozen-lockfile
          node scripts/build-source-review-fixture.mjs /tmp/growthos-review-ui
      - name: Build Chromium cloud image
        run: docker build -f Dockerfile.browser -t growthos-browser-test .
      - name: Test real React return to the prospect enrichment tab
        run: docker run --rm --ipc=host -v /tmp/growthos-review-ui:/fixtures:ro --entrypoint node growthos-browser-test workers/cloud-browser/review-ui-test.mjs
      - name: Test real Chromium with local source fixtures
        run: docker run --rm --ipc=host --entrypoint node growthos-browser-test workers/cloud-browser/runtime-test.mjs
