name: GrowthOS preproduction images

# Build images away from the production VPS. Only a push to this isolated
# branch runs the pipeline; it does not deploy or restart any VPS container.
on:
  push:
    branches:
      - growthos-preprod
      - fix/growthos-functional-redesign
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: growthos-preprod-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: wizard_ci_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Read the preproduction branch
        uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up pinned pnpm 10
        uses: pnpm/action-setup@v6
        with:
          version: 10.26.1
          run_install: false

      - name: Install exactly the locked dependencies
        run: pnpm install --frozen-lockfile

      # The API references the shared db/api libraries as TypeScript projects.
      # Build their .d.ts outputs before validating the API from a clean checkout.
      - name: Compile shared TypeScript libraries
        run: pnpm exec tsc --build

      - name: Check API TypeScript
        run: pnpm --filter @workspace/api-server typecheck

      - name: Check interface TypeScript
        run: pnpm --filter @workspace/growthos typecheck

      - name: Validate in-house Chromium worker syntax
        run: node --check workers/pagesjaunes-browser/server.mjs

      - name: Validate local Chrome extension scripts
        run: |
          node --check extensions/growthos-pagesjaunes/bridge.js
          node --check extensions/growthos-pagesjaunes/background.js
          node -e 'const m=require("./extensions/growthos-pagesjaunes/manifest.json"); if(m.manifest_version!==3 || m.host_permissions.some(p=>!p.includes("pagesjaunes.fr")))process.exit(1)'

      - name: Build API for integration tests
        run: pnpm --filter @workspace/api-server build

      - name: Test first-run wizard and CRM without external email
        env:
          SMOKE_POSTGRES_URL: postgresql://postgres:wizard_ci_only@127.0.0.1:5432/postgres
        run: node scripts/smoke-wizard.mjs

      - name: Test cloud AI connectors without real API calls
        run: pnpm --filter @workspace/api-server exec node --import tsx src/tests/ai-connector-probes.test.ts

      - name: Test SSRF protection of website audits
        run: pnpm --filter @workspace/api-server exec node --import tsx src/tests/seo-safety.test.ts

  build-and-publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: Dockerfile.api
          - component: web
            dockerfile: Dockerfile
          - component: pagesjaunes
            dockerfile: Dockerfile.pagesjaunes
    steps:
      - name: Read the preproduction branch
        uses: actions/checkout@v6

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Select lower-case GHCR repository
        shell: bash
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build on GitHub and publish versioned image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          # Keep immutable revisions for rollback. Only the selected release branch
          # updates the moving preprod tag after all validation checks pass.
          # Switch release branch later with repository variable:
          # GROWTHOS_PREPROD_SOURCE_BRANCH=growthos-preprod
          tags: |
            ${{ env.IMAGE_PREFIX }}/growthos-${{ matrix.component }}:${{ github.sha }}
            ${{ github.ref_name == (vars.GROWTHOS_PREPROD_SOURCE_BRANCH || 'fix/growthos-functional-redesign') && format('{0}/growthos-{1}:preprod', env.IMAGE_PREFIX, matrix.component) || '' }}
          build-args: |
            BASE_PATH=/
            VITE_API_URL=/api/v1
          cache-from: type=gha,scope=growthos-${{ matrix.component }}
          cache-to: type=gha,scope=growthos-${{ matrix.component }},mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
