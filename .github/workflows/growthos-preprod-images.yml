name: GrowthOS preproduction images

# Build images away from the production VPS. Only a push to this isolated
# branch runs the pipeline; it does not deploy or restart any VPS container.
on:
  push:
    branches:
      - growthos-preprod
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: growthos-preprod-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Read the preproduction branch
        uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up pinned pnpm 10
        uses: pnpm/action-setup@v6
        with:
          version: 10.26.1
          run_install: false

      - name: Install exactly the locked dependencies
        run: pnpm install --frozen-lockfile

      # The API references the shared db/api libraries as TypeScript projects.
      # Build their .d.ts outputs before validating the API from a clean checkout.
      - name: Compile shared TypeScript libraries
        run: pnpm exec tsc --build

      - name: Check API TypeScript
        run: pnpm --filter @workspace/api-server typecheck

      - name: Check interface TypeScript
        run: pnpm --filter @workspace/growthos typecheck

      - name: Build API for integration tests
        run: pnpm --filter @workspace/api-server build

      - name: Test first-run wizard and CRM without external email
        run: node scripts/smoke-wizard.mjs

      - name: Test cloud AI connectors without real API calls
        run: pnpm --filter @workspace/api-server exec node --import tsx src/tests/ai-connector-probes.test.ts

  build-and-publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: Dockerfile.api
          - component: web
            dockerfile: Dockerfile
    steps:
      - name: Read the preproduction branch
        uses: actions/checkout@v6

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Select lower-case GHCR repository
        shell: bash
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build on GitHub and publish versioned image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/growthos-${{ matrix.component }}:${{ github.sha }}
          build-args: |
            BASE_PATH=/
            VITE_API_URL=/api/v1
          cache-from: type=gha,scope=growthos-${{ matrix.component }}
          cache-to: type=gha,scope=growthos-${{ matrix.component }},mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
