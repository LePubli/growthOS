services:
  growthos:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # URL of the API (baked in at build time by Vite, overridable at runtime)
        VITE_API_URL: "${VITE_API_URL:-http://api-server:3001}"
        BASE_PATH: "/"
    expose:
      - "80"
    environment:
      # Runtime override — injected into index.html on container start
      VITE_API_URL: "${VITE_API_URL:-http://api-server:3001}"
    depends_on:
      api-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api-server:
    build:
      context: .
      dockerfile: Dockerfile.api
    expose:
      - "3001"
    environment:
      PORT: "3001"
      NODE_ENV: "production"
      DATABASE_URL: "${DATABASE_URL}"
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://localhost:3001/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
