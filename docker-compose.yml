services:
  growthos:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_PATH: "/"
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.growthos-qg3u7f72d9lin10gl2ixlp7x.rule=Host(`igs6f5ezyix8l2my3u3tuxbl.82.22.77.159.sslip.io`)"
      - "traefik.http.routers.growthos-qg3u7f72d9lin10gl2ixlp7x.entrypoints=http"
      - "traefik.http.services.growthos-qg3u7f72d9lin10gl2ixlp7x.loadbalancer.server.port=3000"
    depends_on:
      api-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api-server:
    build:
      context: .
      dockerfile: Dockerfile.api
    expose:
      - "3001"
    environment:
      PORT: "3001"
      NODE_ENV: "production"
      DATABASE_URL: "${DATABASE_URL}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-server-qg3u7f72d9lin10gl2ixlp7x.rule=Host(`vit6buuz2vmqaleuh0z5autx.82.22.77.159.sslip.io`)"
      - "traefik.http.routers.api-server-qg3u7f72d9lin10gl2ixlp7x.entrypoints=http"
      - "traefik.http.services.api-server-qg3u7f72d9lin10gl2ixlp7x.loadbalancer.server.port=3001"
    networks:
      - default
      - coolify
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://localhost:3001/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  coolify:
    external: true
