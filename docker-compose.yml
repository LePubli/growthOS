services:
  growthos:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Leave VITE_API_URL empty so the frontend uses the relative path /api/v1
        # nginx proxies /api/* to the api-server container (see nginx.conf)
        VITE_API_URL: ""
        BASE_PATH: "/"
    expose:
      - "80"
    environment:
      VITE_API_URL: ""
    depends_on:
      api-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api-server:
    build:
      context: .
      dockerfile: Dockerfile.api
    expose:
      - "3001"
    environment:
      PORT: "3001"
      NODE_ENV: "production"
      DATABASE_URL: "${DATABASE_URL}"
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://localhost:3001/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
