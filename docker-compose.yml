services:
  growthos:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # VITE_API_URL vide → frontend utilise /api/v1 (URL relative)
        # nginx proxifie /api/* vers api-server:3001 (voir nginx.conf)
        VITE_API_URL: ""
        BASE_PATH: "/"
    expose:
      - "80"
    environment:
      VITE_API_URL: ""
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.growthos-igs6f5ezyix8l2my3u3tuxbl.rule=Host(`igs6f5ezyix8l2my3u3tuxbl.82.22.77.159.sslip.io`)"
      - "traefik.http.routers.growthos-igs6f5ezyix8l2my3u3tuxbl.entrypoints=http"
      - "traefik.http.services.growthos-igs6f5ezyix8l2my3u3tuxbl.loadbalancer.server.port=80"
    depends_on:
      api-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api-server:
    build:
      context: .
      dockerfile: Dockerfile.api
    expose:
      - "3001"
    environment:
      PORT: "3001"
      NODE_ENV: "production"
      DATABASE_URL: "${DATABASE_URL}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-server-vit6buuz2vmqaleuh0z5autx.rule=Host(`vit6buuz2vmqaleuh0z5autx.82.22.77.159.sslip.io`)"
      - "traefik.http.routers.api-server-vit6buuz2vmqaleuh0z5autx.entrypoints=http"
      - "traefik.http.services.api-server-vit6buuz2vmqaleuh0z5autx.loadbalancer.server.port=3001"
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://localhost:3001/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
