# ============================================================
# GrowthOS Plugin Manifest — Format standard
# Fichier : plugin.yaml (requis à la racine du ZIP)
# ============================================================

# ── Identification ────────────────────────────────────────────
name: "crm-prospecting"           # Identifiant unique (a-z, 0-9, tirets)
displayName: "CRM Prospecting"    # Nom affiché dans l'UI
version: "1.2.0"                  # SemVer
description: "Module de prospection B2B avec scraping multi-sources, enrichissement IA et scoring prédictif"
longDescription: |
  Fonctionnalités complètes de prospection B2B :
  - Scraping INSEE, BODACC, Google Maps, Pages Jaunes
  - Enrichissement email waterfall (Hunter, Dropcontact, SMTP)
  - Scoring prédictif IA (HOT/WARM/COLD)
  - Signaux d'affaires automatiques
  - Pipeline Kanban avec drag & drop

# ── Auteur ───────────────────────────────────────────────────
author: "Le Publicitaire"
authorEmail: "dev@le-publicitaire.fr"
authorUrl: "https://le-publicitaire.fr"

# ── Classification ────────────────────────────────────────────
category: "PROSPECTING"    # CORE, CRM, PROSPECTING, MARKETING, SEO, REPUTATION, AI, AUTOMATION, ANALYTICS, COMMUNICATION, INTEGRATION, TOOLS
icon: "🎯"
tags: ["b2b", "scraping", "enrichissement", "scoring", "pipeline"]

# ── Compatibilité ─────────────────────────────────────────────
minCoreVersion: "1.0.0"
maxCoreVersion: "2.0.0"

# ── Dépendances ───────────────────────────────────────────────
dependencies: []                  # autres plugins requis

# ── Permissions demandées ─────────────────────────────────────
permissions:
  - "prospects:read"
  - "prospects:write"
  - "prospects:delete"
  - "pipeline:read"
  - "pipeline:write"
  - "signals:read"
  - "signals:write"
  - "ai:use"

# ── Backend routes ────────────────────────────────────────────
routes:
  - prefix: "/api/v1/prospects"
    file: "dist/routes/prospects.js"
  - prefix: "/api/v1/pipeline"
    file: "dist/routes/pipeline.js"
  - prefix: "/api/v1/signals"
    file: "dist/routes/signals.js"
  - prefix: "/api/v1/sourcing"
    file: "dist/routes/sourcing.js"
  - prefix: "/api/v1/scorer"
    file: "dist/routes/scorer.js"

# ── Migrations DB tenant ──────────────────────────────────────
migrations:
  - "migrations/001_create_prospects.sql"
  - "migrations/002_create_pipeline.sql"
  - "migrations/003_create_signals.sql"

# ── Event hooks ───────────────────────────────────────────────
hooks:
  - event: "tenant.created"
    handler: "dist/hooks/onTenantCreated.js"
    description: "Crée les stages de pipeline par défaut"

  - event: "prospect.created"
    handler: "dist/hooks/onProspectCreated.js"
    description: "Calcule le score initial"

  - event: "email.opened"
    handler: "dist/hooks/onEmailOpened.js"
    description: "Met à jour le score d'engagement"

# ── Menu items (injectés dans la sidebar) ─────────────────────
menuItems:
  - id: "prospects"
    label: "Prospects"
    icon: "Building2"          # Nom Lucide icon
    href: "/prospects"
    section: "CRM & Pipeline"
    order: 10

  - id: "pipeline"
    label: "Pipeline"
    icon: "GitBranch"
    href: "/pipeline"
    section: "CRM & Pipeline"
    order: 20

  - id: "signals"
    label: "Signaux"
    icon: "Zap"
    href: "/signals"
    section: "Sourcing"
    order: 30

  - id: "sourcing"
    label: "Scraping"
    icon: "Search"
    href: "/sourcing"
    section: "Sourcing"
    order: 10

# ── Dashboard widgets (optionnel) ────────────────────────────
widgets:
  - id: "prospects-kpi"
    label: "KPIs Prospects"
    component: "ProspectsKpiWidget"
    file: "dist/widgets/ProspectsKpiWidget.js"
    size: "large"             # small, medium, large, full

  - id: "pipeline-funnel"
    label: "Funnel Pipeline"
    component: "PipelineFunnelWidget"
    file: "dist/widgets/PipelineFunnelWidget.js"
    size: "medium"

# ── Settings (config UI auto-générée) ───────────────────────
settings:
  - key: "max_prospects_per_job"
    label: "Prospects max par job de scraping"
    type: "number"
    default: 100
    min: 10
    max: 1000

  - key: "auto_score_on_create"
    label: "Scorer automatiquement les nouveaux prospects"
    type: "boolean"
    default: true

  - key: "default_pipeline_stages"
    label: "Étapes de pipeline par défaut"
    type: "array"
    default: ["Nouveau", "Contacté", "En discussion", "Proposition", "Gagné", "Perdu"]

  - key: "email_waterfall_providers"
    label: "Providers email waterfall (ordre de priorité)"
    type: "array"
    default: ["website", "pattern+smtp", "hunter", "dropcontact"]

# ── Billing (si plugin payant) ───────────────────────────────
pricing:
  isFree: true
  # price: 29                  # €/mois si payant
  # priceYearly: 290
  # trialDays: 14
  # plans: ["starter", "pro", "agency", "enterprise"]

# ── Changelog ────────────────────────────────────────────────
changelog: |
  ## v1.2.0
  - Ajout enrichissement BODACC signaux levées de fonds
  - Score prédictif v2 avec facteurs pondérés
  - UI Spreadsheet avec colonnes dynamiques
  
  ## v1.1.0
  - Waterfall email finder (Hunter + Dropcontact + SMTP)
  - Filtres avancés Spreadsheet
  
  ## v1.0.0
  - Version initiale
